<!DOCTYPE html>
<html lang="pt-br">
 
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="estilo.css">
<title>PÁGINA DE LOGIN E GERENCIAMENTO DE USUÁRIOS</title>
</head>
 
<body>
 
    <!-- ============================================================ -->
<!-- 1. FORMULÁRIO DE LOGIN                                       -->
<!-- ============================================================ -->
<form id="formLogin">
<fieldset id="fie">
<legend>LOGIN</legend>
 
            <p>
<label>Login (Email): </label>
<input type="email" id="loginEmail" required>
</p>
 
            <p>
<label>SENHA :</label>
<input type="password" id="loginSenha" required>
</p>
 
            <center>
<button type="submit">FAZER LOGIN</button>
</center>
</fieldset>
</form>
 
 
    <!-- ============================================================ -->
<!-- 2. FORMULÁRIO DE CADASTRO                                    -->
<!-- ============================================================ -->
<form id="formCadastro">
<fieldset id="cad">
<legend>CASO NÃO TENHA LOGIN, CADASTRE-SE</legend>
 
            <p>
<label>Nome</label>
<input type="text" id="cadastroNome" required>
</p>
 
            <p>
<label>Email</label>
<input type="email" id="cadastroEmail" required>
</p>
 
            <p>
<label>Senha</label>
<input type="password" id="cadastroSenha" required>
</p>
 
            <center>
<button type="submit">CADASTRE-SE</button>
<input type="reset" value="Limpar">
</center>
</fieldset>
</form>
 
 
    <!-- ============================================================ -->
<!-- 3. EXCLUIR CONTA COMPLETA (AUTH + FIRESTORE)                 -->
<!-- (Apaga a conta de login e os dados salvos no banco)          -->
<!-- ============================================================ -->
<form id="formDeletarContaPropria">
<fieldset id="delConta">
<legend>EXCLUIR MINHA CONTA COMPLETA</legend>
<p>
<label>E-mail:</label>
<input type="email" id="deletarEmailAuth" required>
</p>
<p>
<label>Senha:</label>
<input type="password" id="deletarSenhaAuth" required>
</p>
<center>
<button type="submit" style="background-color: #f44336; color: white; cursor: pointer;">

                    EXCLUIR MINHA CONTA PERMANENTEMENTE
</button>
</center>
</fieldset>
</form>
 
 
    <!-- ============================================================ -->
<!-- LÓGICA JAVASCRIPT / FIREBASE                                 -->
<!-- ============================================================ -->
<script type="module">
 
        // 1. IMPORTAÇÕES DOS MÓDULOS DO FIREBASE

        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
 
        // Importações do Firebase Auth

        import {

            getAuth,

            createUserWithEmailAndPassword,

            signInWithEmailAndPassword,

            deleteUser

        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
 
        // Importações do Firestore

        import {

            getFirestore,

            doc,

            setDoc,

            deleteDoc

        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
 
 
        // 2. CONFIGURAÇÃO DO FIREBASE

        const firebaseConfig = {

            apiKey: "AIzaSyAxQ-YoMQHs_tS1x53LDFSxHqdZz_VZTnA",

            authDomain: "meu-site-login-61ea4.firebaseapp.com",

            projectId: "meu-site-login-61ea4",

            storageBucket: "meu-site-login-61ea4.firebasestorage.app",

            messagingSenderId: "654892802138",

            appId: "1:654892802138:web:f47e5d7be15c7829367863",

            measurementId: "G-E53XJSS0PL"

        };
 
 
        // 3. INICIALIZAÇÃO DOS SERVIÇOS

        const app = initializeApp(firebaseConfig);

        const auth = getAuth(app);

        const db = getFirestore(app);
 
 
        // ============================================================

        // FUNCIONALIDADE 1: CADASTRO DE USUÁRIO

        // ============================================================

        document.getElementById("formCadastro").addEventListener("submit", async (e) => {

            e.preventDefault();
 
            const nome = document.getElementById("cadastroNome").value;

            const email = document.getElementById("cadastroEmail").value;

            const senha = document.getElementById("cadastroSenha").value;
 
            try {

                // Cria o acesso no Firebase Authentication

                const userCredential = await createUserWithEmailAndPassword(auth, email, senha);

                const user = userCredential.user;
 
                // Salva o nome e email no Firestore vinculados ao UID do usuário

                await setDoc(doc(db, "usuarios", user.uid), {

                    nome: nome,

                    email: email

                });
 
                alert("Usuário cadastrado com sucesso!");

                document.getElementById("formCadastro").reset();
 
            } catch (error) {

                alert("Erro ao cadastrar: " + error.message);

            }

        });
 
 
        // ============================================================

        // FUNCIONALIDADE 2: LOGIN DE USUÁRIO

        // ============================================================

        document.getElementById("formLogin").addEventListener("submit", async (e) => {

            e.preventDefault();
 
            const email = document.getElementById("loginEmail").value;

            const senha = document.getElementById("loginSenha").value;
 
            try {

                // Autentica o usuário no Firebase Auth

                await signInWithEmailAndPassword(auth, email, senha);

                // Redireciona para a página interna

                window.location.href = "site.html";
 
            } catch (error) {

                alert("Erro ao realizar login: " + error.message);

            }

        });
 
 
        // ============================================================

        // FUNCIONALIDADE 3: EXCLUIR CONTA COMPLETA (AUTH + FIRESTORE)

        // ============================================================

        document.getElementById("formDeletarContaPropria").addEventListener("submit", async (e) => {

            e.preventDefault();
 
            const email = document.getElementById("deletarEmailAuth").value;

            const senha = document.getElementById("deletarSenhaAuth").value;
 
            if (!confirm("Tem certeza que deseja apagar permanentemente esta conta?")) {

                return;

            }
 
            try {

                // 1. Faz a verificação/login para garantir autorização

                const userCredential = await signInWithEmailAndPassword(auth, email, senha);

                const user = userCredential.user;
 
                // 2. Apaga o registro do Firestore

                await deleteDoc(doc(db, "usuarios", user.uid));
 
                // 3. Apaga o login no Firebase Auth

                await deleteUser(user);
 
                alert("Conta excluída permanentemente com sucesso!");

                document.getElementById("formDeletarContaPropria").reset();
 
            } catch (error) {

                alert("Erro ao excluir a conta: " + error.message);

            }

        });
 
    </script>
 
</body>
</html>
 

</body>
</html>
